<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Mirror Remote</title>
  <style>
    :root{
      --bg:#0c0b0a;
      --fg:#e7e2d9;
      --muted:#9c968c;
      --tile:#1a1917;
      --tile-soft:#201f1c;
      --accent:#d6d0c6;
    }

    html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,system-ui,sans-serif}
    .wrap{max-width:720px;margin:0 auto;padding:20px}

    /* Header */
    .appbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
    .title{font-weight:700;font-size:28px;letter-spacing:.5px;opacity:.95}
    .logout-btn{background:transparent;border:1px solid rgba(255,255,255,.15);color:var(--fg);padding:8px 12px;border-radius:999px;cursor:pointer}

    /* Page containers */
    .page{display:none;animation:fade .18s ease-out}
    .page.active{display:block}
    @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

    /* Home grid */
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-top:10px}
    .tile{display:flex;flex-direction:column;align-items:center;gap:10px;text-decoration:none;color:var(--fg);cursor:pointer}
    .tile .circle{
      width:120px;height:120px;border-radius:50%;
      background:radial-gradient(110px 110px at 30% 30%, var(--tile) 0%, var(--tile-soft) 70%);
      display:grid;place-items:center;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.05),
                  0 10px 20px rgba(0,0,0,.35);
      transition:transform .12s ease, box-shadow .12s ease;
    }
    .tile:active .circle{transform:scale(.98)}
    .tile .label{font-size:18px;letter-spacing:.4px}
    .muted{color:var(--muted)}

    /* Back bar */
    .backbar{display:flex;align-items:center;gap:10px;margin:8px 0 18px}
    .back-btn{background:#141311;border:1px solid rgba(255,255,255,.08);color:var(--fg);padding:8px 12px;border-radius:10px;cursor:pointer}
    .section-title{font-size:22px;font-weight:700;letter-spacing:.4px;flex:1;opacity:.95;text-align:center}

    /* Cards / forms */
    .card{background:#141311;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:16px;margin:12px 0}
    input, textarea, button, select{
      font:inherit;color:var(--fg);
    }
    input[type="text"], input[type="date"], input[type="time"], textarea{
      width:100%;box-sizing:border-box;background:#0f0e0c;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:12px;margin:6px 0 12px
    }
    button.primary{background:#22201d;border:1px solid rgba(255,255,255,.18);padding:12px 16px;border-radius:12px;cursor:pointer}

    /* Range */
    input[type="range"]{width:100%}

    /* Simple icon-ish glyphs (emoji for lightness) */
    .glyph{font-size:42px;opacity:.92}

    /* Share pill (visual only) */
    .share-wrap{display:flex;justify-content:center;margin:22px 0 8px}
    .share-pill{background:#181715;border:1px solid rgba(255,255,255,.08);padding:14px 28px;border-radius:999px}

    /* Small rows */
    .row{display:flex;align-items:center;gap:10px}
    small.muted{color:var(--muted)}
  </style>
</head>
<body>
<div class="wrap">

  <!-- App Bar -->
  <div class="appbar">
    <div class="title">Smart Mirror Remote</div>
    <button id="remoteLogoutBtn" class="logout-btn">Logout</button>
  </div>

  <!-- ================== HOME (icon grid) ================== -->
  <section id="page-home" class="page active">
    <div class="grid">
      <a class="tile" data-goto="page-message">
        <div class="circle"><div class="glyph">🧭</div></div>
        <div class="label">Message</div>
      </a>
      <a class="tile" data-goto="page-calendar">
        <div class="circle"><div class="glyph">📆</div></div>
        <div class="label">Calendar</div>
      </a>
      <a class="tile" data-goto="page-system">
        <div class="circle"><div class="glyph">⚙️</div></div>
        <div class="label">System</div>
      </a>
      <a class="tile" data-goto="page-stocks">
        <div class="circle"><div class="glyph">📈</div></div>
        <div class="label">Stocks</div>
      </a>
      <a class="tile" data-goto="page-spotify">
        <div class="circle"><div class="glyph">🎵</div></div>
        <div class="label">Spotify</div>
      </a>
      <div class="tile" style="visibility:hidden">
        <div class="circle"></div>
        <div class="label">&nbsp;</div>
      </div>
    </div>

    <div class="share-wrap">
      <div class="share-pill">Share</div>
    </div>
  </section>

  <!-- ================== MESSAGE PAGE ================== -->
  <section id="page-message" class="page">
    <div class="backbar">
      <button class="back-btn" data-goto="page-home">← Home</button>
      <div class="section-title">Message</div>
    </div>
    <div class="card">
      <form id="messageForm">
        <input type="text" name="message" placeholder="New message" required>
        <button class="primary" type="submit">Send</button>
      </form>
    </div>
  </section>

  <!-- ================== CALENDAR PAGE ================== -->
  <section id="page-calendar" class="page">
    <div class="backbar">
      <button class="back-btn" data-goto="page-home">← Home</button>
      <div class="section-title">Calendar</div>
    </div>
    <div class="card">
      <form id="calendarForm">
        <input type="text" name="event_name" placeholder="Event Name" required>
        <input type="date" name="event_date" required>
        <input type="time" name="event_time">
        <textarea name="event_description" placeholder="Event Description (optional)"></textarea>
        <button class="primary" type="submit">Add Event</button>
      </form>
    </div>
  </section>

  <!-- ================== SYSTEM / SETTINGS PAGE ================== -->
  <section id="page-system" class="page">
    <div class="backbar">
      <button class="back-btn" data-goto="page-home">← Home</button>
      <div class="section-title">System</div>
    </div>

    <div class="card">
      <h3 style="margin:0 0 12px">Settings</h3>
      <div class="row" style="justify-content:space-between">
        <label for="pref-24h" class="row" style="cursor:pointer">
          <input type="checkbox" id="pref-24h">
          <span>Use 24-hour time</span>
        </label>
        <small id="pref-save-status" class="muted"></small>
      </div>
      <small class="muted">Controls how the mirror displays the clock and event times.</small>
    </div>

    <div class="card">
      <h3 style="margin:0 0 12px">Session</h3>
      <button id="remoteLogoutBtn_clone" class="primary" style="width:100%">Logout</button>
    </div>
  </section>

  <!-- ================== STOCKS PAGE (placeholder UI only) ================== -->
  <section id="page-stocks" class="page">
    <div class="backbar">
      <button class="back-btn" data-goto="page-home">← Home</button>
      <div class="section-title">Stocks</div>
    </div>
    <div class="card">
      <small class="muted">(Your existing live stocks logic remains unchanged elsewhere.)</small>
    </div>
  </section>

  <!-- ================== SPOTIFY PAGE ================== -->
  <section id="page-spotify" class="page">
    <div class="backbar">
      <button class="back-btn" data-goto="page-home">← Home</button>
      <div class="section-title">Spotify</div>
    </div>

    <div class="card">
      <p><a href="/spotify/login/" style="color:var(--accent)">Connect Spotify</a></p>
      <div class="row" style="flex-wrap:wrap;gap:10px">
        <button id="sp-prev"  class="primary">Prev</button>
        <button id="sp-play"  class="primary">Play</button>
        <button id="sp-pause" class="primary">Pause</button>
        <button id="sp-next"  class="primary">Next</button>
      </div>
      <div style="margin-top:12px">Volume</div>
      <input id="sp-vol" type="range" min="0" max="100" value="50">
      <pre id="sp-state" style="background:#0f0e0c;border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:10px;white-space:pre-wrap"></pre>
    </div>
  </section>

</div>

<!-- =============== NAV JS (purely cosmetic, no logic changed) =============== -->
<script>
  // Page switching (show/hide) using data-goto attr
  const pages = Array.from(document.querySelectorAll('.page'));
  function show(id){
    pages.forEach(p => p.classList.toggle('active', p.id === id));
    // keep both logout buttons in sync (same id target as before)
    const mainLogout = document.getElementById('remoteLogoutBtn');
    const cloneLogout = document.getElementById('remoteLogoutBtn_clone');
    if (cloneLogout && mainLogout) {
      cloneLogout.onclick = mainLogout.onclick;
    }
  }
  document.addEventListener('click', (e)=>{
    const t = e.target.closest('[data-goto]');
    if (!t) return;
    e.preventDefault();
    show(t.getAttribute('data-goto'));
  });
</script>

<!-- ==================== YOUR EXISTING JS (UNCHANGED) ==================== -->
<script>
  function getCookie(name){
    const v = document.cookie.split('; ').find(r=>r.startsWith(name+'='));
    return v ? decodeURIComponent(v.split('=')[1]) : '';
  }

  // ----- MIRROR socket bootstrap (used for time-pref + spotify relays)
  window.addEventListener("DOMContentLoaded", () => {
    fetch("/auth/generate-token/")
      .then(res => res.json())
      .then(data => {
        const loginSocket = new WebSocket("wss://mirror.rr-smartmirror.com/ws/mirror-login/");
        window.MIRROR_WS = loginSocket;
        loginSocket.onopen = () => {
          loginSocket.send(JSON.stringify({ type: "send_token_to_mirror", token: data.token }));
          window.dispatchEvent(new Event("MIRROR_WS_READY"));
        };
        loginSocket.onclose = () => { window.MIRROR_WS = null; };
      })
      .catch(err => console.error("❌ Error generating token:", err));
  });

  // ----- Spotify controls (and forward state to mirror)
  async function ctrl(action, qs=''){
    const res = await fetch(`/spotify/control/${action}/${qs}`, {
      method: 'POST',
      headers: {'X-CSRFToken': getCookie('csrftoken')},
      credentials: 'include',
      cache: 'no-store'
    });
    const j = await res.json().catch(()=>({}));
    try { document.getElementById('sp-state').textContent = JSON.stringify(j.state||j, null, 2); } catch(e){}

    const payload = j.state || null;
    if (payload && window.MIRROR_WS && window.MIRROR_WS.readyState === 1) {
      window.MIRROR_WS.send(JSON.stringify({ type: "spotify_state", payload }));
    }
  }

  document.getElementById('sp-prev').onclick  = ()=>ctrl('prev');
  document.getElementById('sp-play').onclick  = ()=>ctrl('play');
  document.getElementById('sp-pause').onclick = ()=>ctrl('pause');
  document.getElementById('sp-next').onclick  = ()=>ctrl('next');
  document.getElementById('sp-vol').oninput   = (e)=>ctrl('volume', `?v=${e.target.value}`);

  fetch('/spotify/state/', {credentials:'include'})
    .then(r=>r.json()).then(j=>{
      document.getElementById('sp-state').textContent = JSON.stringify(j, null, 2);
      const forward = () => {
        if (window.MIRROR_WS && window.MIRROR_WS.readyState === 1) {
          window.MIRROR_WS.send(JSON.stringify({ type: "spotify_state", payload: j }));
        }
      };
      forward();
      if (!window.MIRROR_WS || window.MIRROR_WS.readyState !== 1) {
        window.addEventListener("MIRROR_WS_READY", forward, { once: true });
      }
    });
</script>

<script>
  // Message form
  document.getElementById("messageForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const message = e.target.message.value.trim();
    fetch("https://mirror.rr-smartmirror.com/Message/update-message/", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ message }),
      credentials: "include",
      cache: "no-store"
    }).then(r=>r.json()).then(()=> alert("Message sent!")).catch(err=>alert(err.message));
  });

  // Calendar form
  document.getElementById("calendarForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const form = e.target;
    const body = new URLSearchParams({
      event_name: form.event_name.value,
      event_date: form.event_date.value,
      event_time: form.event_time.value,
      event_description: form.event_description.value
    });
    fetch("https://mirror.rr-smartmirror.com/Calendar/add-event/", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body,
      credentials: "include",
      cache: "no-store"
    }).then(r=>r.json()).then(()=> alert("Event saved!")).catch(err=>alert(err.message));
  });

  // Logout (kept exactly the same; wired to both buttons)
  async function secureLogout() {
    const res = await fetch("/auth/csrf/", { credentials: "include", cache: "no-store" });
    const { csrfToken } = await res.json();
    fetch("/auth/logout/", {
      method: "POST",
      headers: { "X-CSRFToken": csrfToken },
      credentials: "include",
      cache: "no-store"
    }).then(() => { window.location.href = "/auth/login/"; });
  }
  document.getElementById("remoteLogoutBtn").addEventListener("click", (e) => {
    e.preventDefault();
    secureLogout();
  });
  // Clone button on System page mirrors the same handler in show()
  if (document.getElementById("remoteLogoutBtn_clone")) {
    document.getElementById("remoteLogoutBtn_clone").addEventListener("click", (e) => {
      e.preventDefault();
      secureLogout();
    });
  }

  // Settings save + live push (unchanged)
  const prefCheckbox = document.getElementById('pref-24h');
  const prefStatus = document.getElementById('pref-save-status');
  async function loadTimePref() {
    const r = await fetch('/auth/settings/time-format/', { credentials: 'include', cache: 'no-store' });
    const j = await r.json(); prefCheckbox.checked = !!j.use_24h;
  }
  async function saveTimePref(checked) {
    prefStatus.textContent = 'Saving…';
    const body = new URLSearchParams({ use_24h: checked ? '1' : '0' });
    await fetch('/auth/settings/time-format/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-CSRFToken': getCookie('csrftoken') },
      credentials: 'include',
      cache: 'no-store',
      body
    });
    if (window.MIRROR_WS && window.MIRROR_WS.readyState === 1) {
      window.MIRROR_WS.send(JSON.stringify({ type: 'time_pref', use_24h: !!checked }));
    }
    prefStatus.textContent = 'Saved'; setTimeout(()=> prefStatus.textContent = '', 1200);
  }
  loadTimePref();
  prefCheckbox.addEventListener('change', e => saveTimePref(e.target.checked));
</script>

</body>
</html>

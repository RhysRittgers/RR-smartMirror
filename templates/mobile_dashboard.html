<!DOCTYPE html>
<html lang="en">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mirror Controller</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    button { padding: 10px 20px; font-size: 1.2rem; margin: 10px; cursor: pointer; }
    .settings-card { margin-top: 24px; padding: 16px; border: 1px solid #e4e4e4; border-radius: 8px; background: #fafafa; }
    .row { display: flex; align-items: center; gap: 8px; }
    small.muted { color: #666; }
  </style>
</head>
<body>
<h1>Smart Mirror Remote</h1>

<h2>Update Mirror Message</h2>
<form id="messageForm">
  <input type="text" name="message" placeholder="New message" required>
  <button type="submit">Send</button>
</form>

<h2>Add New Calendar Event</h2>
<form id="calendarForm">
  <input type="text" name="event_name" placeholder="Event Name" required><br>
  <input type="date" name="event_date" required><br>
  <input type="time" name="event_time"><br>
  <textarea name="event_description" placeholder="Event Description (optional)"></textarea><br>
  <button type="submit">Add Event</button>
</form>

<h2>Spotify</h2>
<p><a href="/spotify/login/">Connect Spotify</a></p>
<div>
  <button id="sp-prev">Prev</button>
  <button id="sp-play">Play</button>
  <button id="sp-pause">Pause</button>
  <button id="sp-next">Next</button>
</div>
<div style="margin-top:8px;">Volume: <input id="sp-vol" type="range" min="0" max="100" value="50"></div>

<div class="settings-card">
  <h2>Settings</h2>
  <div class="row">
    <label for="pref-24h" style="cursor:pointer;">
      <input type="checkbox" id="pref-24h">
      Use 24-hour time
    </label>
    <small id="pref-save-status" class="muted"></small>
  </div>
  <small class="muted">Controls how the mirror displays the clock and event times.</small>
</div>

<button id="remoteLogoutBtn">Logout</button>

<script>
  function getCookie(name){
    const v = document.cookie.split('; ').find(r=>r.startsWith(name+'='));
    return v ? decodeURIComponent(v.split('=')[1]) : '';
  }

  // Mirror-login WS bootstrap (for time pref; Spotify display stays on mirror)
  window.addEventListener("DOMContentLoaded", () => {
    fetch("/auth/generate-token/")
      .then(res => res.json())
      .then(data => {
        const loginSocket = new WebSocket("wss://mirror.rr-smartmirror.com/ws/mirror-login/");
        window.MIRROR_WS = loginSocket;
        loginSocket.onopen = () => {
          loginSocket.send(JSON.stringify({ type: "send_token_to_mirror", token: data.token }));
          window.dispatchEvent(new Event("MIRROR_WS_READY"));
        };
        loginSocket.onclose = () => { window.MIRROR_WS = null; };
      })
      .catch(err => console.error("❌ Error generating token:", err));
  });

  // Spotify controls (no JSON dump, backend broadcasts to mirror groups)
  async function ctrl(action, qs=''){
    const res = await fetch(`/spotify/control/${action}/${qs}`, {
      method: 'POST',
      headers: {'X-CSRFToken': getCookie('csrftoken')},
      credentials: 'include',
      cache: 'no-store'
    });
    try { await res.json(); } catch(_) {}
  }

  document.getElementById('sp-prev').onclick  = ()=>ctrl('prev');
  document.getElementById('sp-play').onclick  = ()=>ctrl('play');
  document.getElementById('sp-pause').onclick = ()=>ctrl('pause');
  document.getElementById('sp-next').onclick  = ()=>ctrl('next');
  document.getElementById('sp-vol').oninput   = (e)=>ctrl('volume', `?v=${e.target.value}`);
</script>

<script>
  // Message form
  document.getElementById("messageForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const message = e.target.message.value.trim();
    fetch("https://mirror.rr-smartmirror.com/Message/update-message/", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ message }),
      credentials: "include",
      cache: "no-store"
    }).then(r=>r.json()).then(()=> alert("Message sent!")).catch(err=>alert(err.message));
  });

  // Calendar form
  document.getElementById("calendarForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const form = e.target;
    const body = new URLSearchParams({
      event_name: form.event_name.value,
      event_date: form.event_date.value,
      event_time: form.event_time.value,
      event_description: form.event_description.value
    });
    fetch("https://mirror.rr-smartmirror.com/Calendar/add-event/", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body,
      credentials: "include",
      cache: "no-store"
    }).then(r=>r.json()).then(()=> alert("Event saved!")).catch(err=>alert(err.message));
  });

  // Logout
  async function secureLogout() {
    const res = await fetch("/auth/csrf/", { credentials: "include", cache: "no-store" });
    const { csrfToken } = await res.json();
    fetch("/auth/logout/", {
      method: "POST",
      headers: "X-CSRFToken" in {} ? {'X-CSRFToken': csrfToken} : {},
      credentials: "include",
      cache: "no-store"
    }).then(() => { window.location.href = "/auth/login/"; });
  }
  document.getElementById("remoteLogoutBtn").addEventListener("click", (e) => {
    e.preventDefault();
    secureLogout();
  });

  // Settings save + live push
  const prefCheckbox = document.getElementById('pref-24h');
  const prefStatus = document.getElementById('pref-save-status');
  async function loadTimePref() {
    const r = await fetch('/auth/settings/time-format/', { credentials: 'include', cache: 'no-store' });
    const j = await r.json(); prefCheckbox.checked = !!j.use_24h;
  }
  async function saveTimePref(checked) {
    prefStatus.textContent = 'Saving…';
    const body = new URLSearchParams({ use_24h: checked ? '1' : '0' });
    await fetch('/auth/settings/time-format/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-CSRFToken': getCookie('csrftoken') },
      credentials: 'include',
      cache: 'no-store',
      body
    });
    if (window.MIRROR_WS && window.MIRROR_WS.readyState === 1) {
      window.MIRROR_WS.send(JSON.stringify({ type: 'time_pref', use_24h: !!checked }));
    }
    prefStatus.textContent = 'Saved'; setTimeout(()=> prefStatus.textContent = '', 1200);
  }
  loadTimePref();
  prefCheckbox.addEventListener('change', e => saveTimePref(e.target.checked));
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirror Controller</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 1.2rem;
            margin: 10px;
            cursor: pointer;
        }
        .settings-card {
            margin-top: 24px;
            padding: 16px;
            border: 1px solid #e4e4e4;
            border-radius: 8px;
            background: #fafafa;
        }
        .row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        small.muted { color: #666; }
    </style>
</head>
<body>
<h1>Smart Mirror Remote</h1>

<!-- MESSAGE -->
<h2>Update Mirror Message</h2>
<form id="messageForm">
    <input type="text" name="message" placeholder="New message" required>
    <button type="submit">Send</button>
</form>

<!-- CALENDAR -->
<h2>Add New Calendar Event</h2>
<form id="calendarForm">
    <input type="text" name="event_name" placeholder="Event Name" required><br>
    <input type="date" name="event_date" required><br>
    <input type="time" name="event_time"><br>
    <textarea name="event_description" placeholder="Event Description (optional)"></textarea><br>
    <button type="submit">Add Event</button>
</form>

<!-- SPOTIFY CONTROL -->
<h2>Spotify</h2>
<p>
  <a href="/spotify/login/">Connect Spotify</a>
</p>
<div>
  <button id="sp-prev">Prev</button>
  <button id="sp-play">Play</button>
  <button id="sp-pause">Pause</button>
  <button id="sp-next">Next</button>
</div>
<div style="margin-top:8px;">
  Volume: <input id="sp-vol" type="range" min="0" max="100" value="50">
</div>
<pre id="sp-state" style="background:#f6f6f6;padding:8px;"></pre>

<!-- SETTINGS -->
<div class="settings-card">
  <h2>Settings</h2>
  <div class="row">
    <label for="pref-24h" style="cursor:pointer;">
      <input type="checkbox" id="pref-24h">
      Use 24-hour time
    </label>
    <small id="pref-save-status" class="muted"></small>
  </div>
  <small class="muted">This preference controls how the mirror displays the clock.</small>
</div>

<button id="remoteLogoutBtn">Logout</button>

<script>
  function getCookie(name){
    const v = document.cookie.split('; ').find(r=>r.startsWith(name+'='));
    return v ? decodeURIComponent(v.split('=')[1]) : '';
  }

  async function ctrl(action, qs=''){
    const res = await fetch(`/spotify/control/${action}/${qs}`, {
      method: 'POST',
      headers: {'X-CSRFToken': getCookie('csrftoken')},
      credentials: 'include',
      cache: 'no-store'
    });
    const j = await res.json().catch(()=>({}));
    try { document.getElementById('sp-state').textContent = JSON.stringify(j.state||j, null, 2); } catch(e){}
  }

  document.getElementById('sp-prev').onclick  = ()=>ctrl('prev');
  document.getElementById('sp-play').onclick  = ()=>ctrl('play');
  document.getElementById('sp-pause').onclick = ()=>ctrl('pause');
  document.getElementById('sp-next').onclick  = ()=>ctrl('next');
  document.getElementById('sp-vol').oninput   = (e)=>ctrl('volume', `?v=${e.target.value}`);

  // show initial spotify state on load
  fetch('/spotify/state/', {credentials:'include'})
    .then(r=>r.json()).then(j=>{
      document.getElementById('sp-state').textContent = JSON.stringify(j, null, 2);
    });
</script>

<script>
  // Mirror login token push
  window.addEventListener("DOMContentLoaded", () => {
    fetch("/auth/generate-token/")
      .then(res => res.json())
      .then(data => {
        const token = data.token;
        const loginSocket = new WebSocket("wss://mirror.rr-smartmirror.com/ws/mirror-login/");
        loginSocket.onopen = () => {
          loginSocket.send(JSON.stringify({
            type: "send_token_to_mirror",
            token: token
          }));
          console.log("🔐 Sent token to mirror:", token);
        };
      })
      .catch(err => console.error("❌ Error generating token:", err));
  });

  // Message form submit
  document.getElementById("messageForm").addEventListener("submit", function (e) {
    e.preventDefault();
    const message = e.target.message.value.trim();
    fetch("https://mirror.rr-smartmirror.com/Message/update-message/", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ message }),
      credentials: "include",
      cache: "no-store"
    })
    .then(res => res.json())
    .then(data => {
      console.log("✅ Message saved and broadcasted:", data);
      alert("Success: " + data.status);
    })
    .catch(err => {
      console.error("❌ FETCH ERROR:", err);
      alert("Error: " + err.message);
    });
  });

  // Calendar form submit
  document.getElementById("calendarForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const form = e.target;
    const formData = new URLSearchParams();
    formData.append("event_name", form.event_name.value);
    formData.append("event_date", form.event_date.value);
    formData.append("event_time", form.event_time.value);
    formData.append("event_description", form.event_description.value);

    fetch("https://mirror.rr-smartmirror.com/Calendar/add-event/", {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: formData,
      credentials: "include",
      cache: "no-store"
    })
    .then(res => res.json())
    .then(data => {
      console.log("✅ Event saved and broadcasted:", data);
      alert("Success: " + data.status);
    })
    .catch(err => {
      console.error("❌ Calendar FETCH error:", err);
      alert("Error: " + err.message);
    });
  });

  // Logout
  async function secureLogout() {
    const res = await fetch("/auth/csrf/", { credentials: "include", cache: "no-store" });
    const data = await res.json();
    const csrfToken = data.csrfToken;

    fetch("/auth/logout/", {
      method: "POST",
      headers: { "X-CSRFToken": csrfToken },
      credentials: "include",
      cache: "no-store"
    }).then(() => {
      window.location.href = "/auth/login/";
    });
  }
  document.getElementById("remoteLogoutBtn").addEventListener("click", (e) => {
    e.preventDefault();
    secureLogout();
  });

  // === Settings: 24h time toggle ===
  const prefCheckbox = document.getElementById('pref-24h');
  const prefStatus = document.getElementById('pref-save-status');

  async function loadTimePref() {
    try {
      const r = await fetch('/auth/settings/time-format/', { credentials: 'include', cache: 'no-store' });
      const j = await r.json();
      prefCheckbox.checked = !!j.use_24h;
    } catch (e) {
      console.warn('Could not load time pref', e);
    }
  }

  async function saveTimePref(checked) {
    prefStatus.textContent = 'Saving…';
    try {
      const body = new URLSearchParams();
      body.set('use_24h', checked ? '1' : '0');
      const r = await fetch('/auth/settings/time-format/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'X-CSRFToken': getCookie('csrftoken') },
        credentials: 'include',
        cache: 'no-store',
        body
      });
      const j = await r.json();
      prefStatus.textContent = 'Saved';
      setTimeout(()=> prefStatus.textContent = '', 1200);
    } catch (e) {
      prefStatus.textContent = 'Failed to save';
    }
  }

  // init
  loadTimePref();
  prefCheckbox.addEventListener('change', e => saveTimePref(e.target.checked));
</script>
</body>
</html>

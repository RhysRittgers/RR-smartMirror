<div id="weather-{{ um.id }}">
  <h2 style="margin:0 0 6px 0;">Weather</h2>
  <div class="line" style="opacity:.85"></div>
  <div class="wx-current" style="margin-top:10px">Loading…</div>
  <div class="wx-extra" style="margin-top:8px; font-size:14px; opacity:.8"></div>
</div>

<script>
(function(){
  const root = document.getElementById("weather-{{ um.id }}");
  const currentEl = root.querySelector(".wx-current");
  const extraEl   = root.querySelector(".wx-extra");

  async function load() {
    try {
      const res = await fetch("/Weather/user_weather/", { credentials: "include", cache: "no-store" });
      const j = await res.json();
      // Shape follows your Weather.views user_weather response
      const t = j?.current || j; // be tolerant
      const desc = t?.description || t?.weather || "—";
      const temp = (t?.temp_f ?? t?.temp) ?? "—";
      const feels = (t?.feels_like_f ?? t?.feels_like) ?? null;
      currentEl.textContent = `${desc} — ${temp}°`;
      extraEl.textContent = feels ? `Feels like ${feels}°` : "";
    } catch(e){
      currentEl.textContent = "Weather unavailable";
    }
  }

  load();
  // re-poll every 5 mins (lightweight)
  setInterval(load, 5 * 60 * 1000);
})();
</script>

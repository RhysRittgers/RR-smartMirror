<div id="stocks-{{ um.id }}">
  <h2 style="margin:0 0 6px 0;">Stocks</h2>
  <div class="line" style="opacity:.85"></div>
  <ul class="stk-list" style="list-style:none;margin:10px 0 0;padding:0;display:grid;gap:6px;"></ul>
</div>

<script>
(function(){
  const root = document.getElementById("stocks-{{ um.id }}");
  const list = root.querySelector(".stk-list");

  async function load() {
    try {
      const res = await fetch("/Stocks/user_stocks/", { credentials: "include", cache: "no-store" });
      const j = await res.json();
      const rows = j?.stocks || [];
      list.innerHTML = rows.map(r=>{
        const sym = r.symbol ?? r.ticker ?? "—";
        const price = (r.price ?? r.current ?? "—");
        const ch = r.change ?? r.delta ?? 0;
        const sign = ch > 0 ? "+" : (ch < 0 ? "–" : "");
        const color = ch > 0 ? "#8fd68f" : (ch < 0 ? "#f09696" : "#cfcfcf");
        return `<li style="display:flex;justify-content:space-between">
          <span>${sym}</span>
          <span style="color:${color}">${price} <small>${sign}${Math.abs(ch)}</small></span>
        </li>`;
      }).join("");
    } catch(e){
      list.innerHTML = `<li>Stocks unavailable</li>`;
    }
  }

  load();
  setInterval(load, 60 * 1000); // refresh every min
})();
</script>
